<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anda Sedang Offline - Rhantech</title>
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
    <meta name="theme-color" content="#0a1628">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a1628;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 36px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        .icon-wrap {
            width: 80px; height: 80px;
            background: rgba(0, 212, 255, 0.12);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 38px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff, #a8e6f0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #00b3cc, #0077a8);
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(0, 179, 204, 0.35);
            transition: all 0.2s ease;
        }
        .btn-retry:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .wifi-icon {
            display: inline-block;
            width: 40px; height: 40px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrap">
            ⚡
        </div>
        <h1>Koneksi Terputus</h1>
        <p>Anda sedang berada dalam mode offline. Silakan periksa kembali jaringan internet Anda lalu muat ulang halaman.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            Muat Ulang Halaman
        </button>
    </div>
</body>
</html>

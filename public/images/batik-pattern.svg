<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="batikCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glowing core nodes behind motifs -->
  <circle cx="60" cy="60" r="32" fill="url(#batikCenterGlow)"/>
  <circle cx="0" cy="0" r="25" fill="url(#batikCenterGlow)"/>
  <circle cx="120" cy="0" r="25" fill="url(#batikCenterGlow)"/>
  <circle cx="0" cy="120" r="25" fill="url(#batikCenterGlow)"/>
  <circle cx="120" cy="120" r="25" fill="url(#batikCenterGlow)"/>

  <!-- Ornate Indonesian Batik Kawung & Parang Accents -->
  <!-- Outer Petals / Kawung Body -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round">
    <!-- Center 4-lobed Kawung -->
    <path d="M 60,26 C 46,26 36,40 36,60 C 36,80 46,94 60,94 C 74,94 84,80 84,60 C 84,40 74,26 60,26 Z"/>
    <path d="M 26,60 C 26,46 40,36 60,36 C 80,36 94,46 94,60 C 94,74 80,84 60,84 C 40,84 26,74 26,60 Z"/>

    <!-- Corner Kawung Petals (Seamless Repeat) -->
    <path d="M 0,-34 C -14,-34 -24,-20 -24,0 C -24,20 -14,34 0,34 C 14,34 24,20 24,0 C 24,-20 14,-34 0,-34 Z"/>
    <path d="M -34,0 C -34,-14 -20,-24 0,-24 C 20,-24 34,-14 34,0 C 34,14 20,24 0,24 C -20,24 -34,14 -34,0 Z"/>

    <path d="M 120,-34 C 106,-34 96,-20 96,0 C 96,20 106,34 120,34 C 134,34 144,20 144,0 C 144,-20 134,-34 120,-34 Z"/>
    <path d="M 86,0 C 86,-14 100,-24 120,-24 C 140,-24 154,-14 154,0 C 154,14 140,24 120,24 C 100,24 86,14 86,0 Z"/>

    <path d="M 0,86 C -14,86 -24,100 -24,120 C -24,140 -14,154 0,154 C 14,154 24,140 24,120 C 24,100 14,86 0,86 Z"/>
    <path d="M -34,120 C -34,106 -20,96 0,96 C 20,96 34,106 34,120 C 34,134 20,144 0,144 C -20,144 -34,134 -34,120 Z"/>

    <path d="M 120,86 C 106,86 96,100 96,120 C 96,140 106,154 120,154 C 134,154 144,140 144,120 C 144,100 134,86 120,86 Z"/>
    <path d="M 86,120 C 86,106 100,96 120,96 C 140,96 154,106 154,120 C 154,134 140,144 120,144 C 100,144 86,134 86,120 Z"/>
  </g>

  <!-- Inner Petal Contours (Fine Canting Linework) -->
  <g fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.85">
    <path d="M 60,34 C 50,34 43,45 43,60 C 43,75 50,86 60,86 C 70,86 77,75 77,60 C 77,45 70,34 60,34 Z"/>
    <path d="M 34,60 C 34,50 45,43 60,43 C 75,43 86,50 86,60 C 86,70 75,77 60,77 C 45,77 34,70 34,60 Z"/>

    <!-- Corner Inner Contours -->
    <path d="M 0,-26 C -10,-26 -17,-15 -17,0 C -17,15 -10,26 0,26 C 10,26 17,15 17,0 C 17,-15 10,-26 0,-26 Z"/>
    <path d="M -26,0 C -26,-10 -15,-17 0,-17 C 15,-17 26,-10 26,0 C 26,10 15,17 0,17 C -15,17 -26,10 -26,0 Z"/>

    <path d="M 120,-26 C 110,-26 103,-15 103,0 C 103,15 110,26 120,26 C 130,26 137,15 137,0 C 137,-15 130,-26 120,-26 Z"/>
    <path d="M 94,0 C 94,-10 105,-17 120,-17 C 135,-17 146,-10 146,0 C 146,10 135,17 120,17 C 105,17 94,10 94,0 Z"/>

    <path d="M 0,94 C -10,94 -17,105 -17,120 C -17,135 -10,146 0,146 C 10,146 17,135 17,120 C 17,105 10,94 0,94 Z"/>
    <path d="M -26,120 C -26,110 -15,103 0,103 C 15,103 26,110 26,120 C 26,130 15,137 0,137 C -15,137 -26,130 -26,120 Z"/>

    <path d="M 120,94 C 110,94 103,105 103,120 C 103,135 110,146 120,146 C 130,146 137,135 137,120 C 137,105 130,94 120,94 Z"/>
    <path d="M 94,120 C 94,110 105,103 120,103 C 135,103 146,110 146,120 C 146,130 135,137 120,137 C 105,137 94,130 94,120 Z"/>
  </g>

  <!-- Golden Ceplokan & Cross Stars (Batik Keraton Gold Accents) -->
  <g fill="#fbbf24" stroke="#f59e0b" stroke-width="0.8">
    <!-- Star Points at Intersections -->
    <path d="M 60,6 L 63,16 L 73,19 L 63,22 L 60,32 L 57,22 L 47,19 L 57,16 Z"/>
    <path d="M 60,88 L 63,98 L 73,101 L 63,104 L 60,114 L 57,104 L 47,101 L 57,98 Z"/>
    <path d="M 6,60 L 16,63 L 19,73 L 22,63 L 32,60 L 22,57 L 19,47 L 16,57 Z"/>
    <path d="M 88,60 L 98,63 L 101,73 L 104,63 L 114,60 L 104,57 L 101,47 L 98,57 Z"/>
  </g>

  <!-- Traditional Cecek-Cecek (Indonesian Batik Stippling Dots) -->
  <g fill="#ffffff">
    <!-- Center Rosette -->
    <circle cx="60" cy="60" r="4.5" fill="#38bdf8"/>
    <circle cx="60" cy="60" r="2.2" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="4.5" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="2.2" fill="#fbbf24"/>
    <circle cx="120" cy="0" r="4.5" fill="#38bdf8"/>
    <circle cx="120" cy="0" r="2.2" fill="#fbbf24"/>
    <circle cx="0" cy="120" r="4.5" fill="#38bdf8"/>
    <circle cx="0" cy="120" r="2.2" fill="#fbbf24"/>
    <circle cx="120" cy="120" r="4.5" fill="#38bdf8"/>
    <circle cx="120" cy="120" r="2.2" fill="#fbbf24"/>

    <!-- Vertical and Horizontal Dots Along Axis -->
    <circle cx="60" cy="42" r="1.6"/>
    <circle cx="60" cy="48" r="1.6"/>
    <circle cx="60" cy="72" r="1.6"/>
    <circle cx="60" cy="78" r="1.6"/>
    <circle cx="42" cy="60" r="1.6"/>
    <circle cx="48" cy="60" r="1.6"/>
    <circle cx="72" cy="60" r="1.6"/>
    <circle cx="78" cy="60" r="1.6"/>

    <!-- Diagonal Accent Dots -->
    <circle cx="44" cy="44" r="2" fill="#fbbf24"/>
    <circle cx="76" cy="44" r="2" fill="#fbbf24"/>
    <circle cx="44" cy="76" r="2" fill="#fbbf24"/>
    <circle cx="76" cy="76" r="2" fill="#fbbf24"/>

    <circle cx="38" cy="38" r="1.4" fill="#67e8f9"/>
    <circle cx="82" cy="38" r="1.4" fill="#67e8f9"/>
    <circle cx="38" cy="82" r="1.4" fill="#67e8f9"/>
    <circle cx="82" cy="82" r="1.4" fill="#67e8f9"/>
  </g>

  <!-- Flowing Diagonal Tendrils (Parang waves connecting lobes) -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75">
    <path d="M 18,18 Q 36,24 46,46"/>
    <path d="M 102,18 Q 84,24 74,46"/>
    <path d="M 18,102 Q 36,96 46,74"/>
    <path d="M 102,102 Q 84,96 74,74"/>
  </g>
</svg>
